<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline</title>
    <!--
      Shown by Capacitor (server.errorPath) when the live site can't be loaded.
      On Android this page has no access to Capacitor plugins, so keep it to
      plain HTML and JS.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        background: #020617;
        color: #f1f5f9;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #94a3b8; }
      button {
        min-height: 44px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
      button:active { background: #1d4ed8; }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach the server</h1>
      <p>Check your internet connection and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      var APP_URL = "https://hrms.intelliforge.tech/";
      var button = document.getElementById("retry");
      function retry() {
        button.disabled = true;
        button.textContent = "Connecting…";
        window.location.replace(APP_URL);
      }
      button.addEventListener("click", retry);
      // Come back on our own once the connection returns.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
